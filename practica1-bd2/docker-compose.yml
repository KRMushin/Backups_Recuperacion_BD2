services:
  mysql:
    image: mysql:8.0-debian
    container_name: hotel_mysql
    restart: unless-stopped
    environment:
      TZ: "America/Guatemala"
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}    
    ports:
      - "3306:3306"
    command:
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --server-id=1
      - --binlog-expire-logs-seconds=604800
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts:/scripts:ro
      - ./backups:/backups
  opencode:
    image: node:20
    container_name: opencode_dev
    working_dir: /workspace
    volumes:
      - .:/workspace
    stdin_open: true
    tty: true
    command: sh -c "npm install -g opencode-ai && opencode"
volumes:
  mysql_data:	          
